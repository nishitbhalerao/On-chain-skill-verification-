[package]
name = "skill_oracle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
soroban-spec-tools = "21.0.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
